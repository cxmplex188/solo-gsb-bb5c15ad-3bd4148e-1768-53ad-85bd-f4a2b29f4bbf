services:
  api:
    build: .
    image: rule-adjudication-api
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
